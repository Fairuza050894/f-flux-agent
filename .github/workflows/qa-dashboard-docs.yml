name: QA Dashboard Quality Gates

on:
  pull_request:
    paths:
      - "qa_dashboard/**"
      - "tests/qa_dashboard/**"
      - "docs/qa-dashboard/**"
      - "scripts/generate_qa_dashboard_docs.py"
      - "scripts/qa_dashboard_quality_gate.py"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/qa-dashboard-docs.yml"

  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "qa_dashboard/**"
      - "tests/qa_dashboard/**"
      - "docs/qa-dashboard/**"
      - "scripts/generate_qa_dashboard_docs.py"
      - "scripts/qa_dashboard_quality_gate.py"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/qa-dashboard-docs.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-dashboard-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa_dashboard/frontend_v3/package-lock.json

      - name: Install frontend dependencies
        working-directory: qa_dashboard/frontend_v3
        run: npm ci

      - name: Run QA Dashboard quality gates
        run: uv run python scripts/qa_dashboard_quality_gate.py
